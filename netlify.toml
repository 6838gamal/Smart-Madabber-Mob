[build]
  command = "flutter build web --release --pwa-strategy=none"
  base    = "."
  publish = "build/web"

# إعادة التوجيه لـ index.html فقط للمسارات غير الموجودة فعلياً
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ===== منع الكاش عن ملفات التحكم =====
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

# 🔴 الأهم: Service Worker لا يُكاش أبداً
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

# ملفات الأصول (اسمها يحمل hash عادةً، لكن امنع الكاش احتياطاً)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
