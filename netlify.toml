[build]
  command = "flutter build web --release --pwa-strategy=none"
  base    = "."
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# منع كاش index.html و version.json تماماً
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

# main.dart.js — اسمح بكاش قصير جداً (لأن اسمه ثابت)
[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
